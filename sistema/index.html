<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema M7</title>
<link rel="stylesheet" href="../identidade-visual/tokens.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--papel-frio);color:var(--texto);font-size:15px;min-height:100vh;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3{font-family:var(--font-display);color:var(--tinta);text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
h1{font-size:34px;font-weight:800}
h2{font-size:21px;font-weight:700;margin-bottom:12px}
h3{font-size:17px;font-weight:700}

.lado{width:236px;flex:none;background:var(--grad-brand);color:var(--on-dark-2);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.lado .logo{padding:22px 20px 18px;border-bottom:1px solid var(--linha-escura)}
.lado .logo img{width:100%;max-width:180px;display:block}
.lado nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.lado nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;display:flex;align-items:center;gap:11px;color:var(--on-dark-dim);font-weight:600;font-size:15px}
.lado nav button svg{width:19px;height:19px;flex:none}
.lado nav button:hover{background:var(--grafite-2);color:var(--on-dark)}
.lado nav button.ativo{background:var(--verde-veu);color:var(--verde)}
.lado .rodape{padding:14px 16px;font-size:12px;color:var(--on-dark-dim);border-top:1px solid var(--linha-escura)}
.lado .rodape select{width:100%;margin:5px 0 10px;background:var(--grafite-2);border:1px solid var(--linha-escura);color:var(--on-dark);border-radius:6px;padding:6px 8px;font-size:13px}

main{flex:1;min-width:0;padding:26px 32px 60px}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.topo p{color:var(--suave);margin-top:4px}
.topo .acoes{display:flex;gap:8px;flex-wrap:wrap}
.aviso{background:#FFF7E0;border:1px solid #F0D98A;color:#5C4A00;border-radius:8px;padding:9px 14px;font-size:13px;margin-bottom:18px}
.aviso.verde{background:var(--verde-veu);border-color:transparent;color:var(--verde-tinta)}

.grade{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.cartao{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:18px}
.kpi .rot,.rot{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);font-weight:600}
.kpi .val{font-family:var(--font-display);font-size:30px;font-weight:800;color:var(--tinta);margin-top:6px;white-space:nowrap}
.kpi .sub{font-size:13px;color:var(--suave);margin-top:2px}
.kpi.escuro{background:var(--preto);border-color:var(--preto)}
.kpi.escuro .rot{color:var(--on-dark-dim)}.kpi.escuro .val{color:var(--verde)}.kpi.escuro .sub{color:var(--on-dark-dim)}
.barra{height:9px;background:var(--papel-frio);border-radius:99px;overflow:hidden;margin-top:6px;position:relative}
.barra i{display:block;height:100%;background:var(--verde-fundo);border-radius:99px}
.barra b{position:absolute;top:-3px;width:2px;height:15px;background:var(--tinta)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--linha);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clica{cursor:pointer}tr.clica:hover td{background:var(--papel-frio)}
.tabela{overflow-x:auto}

.btn{border:1px solid var(--linha);background:var(--papel);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--suave)}
.btn.prim{background:var(--preto);color:var(--verde);border-color:var(--preto)}
.btn.prim:hover{background:var(--grafite-2)}
.btn.verde{background:var(--verde);color:var(--preto);border-color:var(--verde)}
.btn.peq{padding:5px 10px;font-size:13px}
.btn.larga{width:100%;justify-content:center}
.campo{border:1px solid var(--linha);border-radius:8px;padding:9px 12px;background:var(--papel);width:100%}
.campo:focus{outline:2px solid var(--verde);border-color:var(--verde-fundo)}
.campo.mini{padding:4px 8px;width:90px;text-align:right}
label.r{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--suave);font-weight:600;margin-bottom:5px}
.filtros{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filtros .campo{width:auto;flex:1;min-width:180px}
.abas{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}

.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--papel-frio);border:1px solid var(--linha);white-space:nowrap}
.tag.ok{background:var(--verde-veu);border-color:transparent;color:var(--verde-tinta)}
.tag.alerta{background:#FDECEC;border-color:transparent;color:#9B1C1C}
.tag.esp{background:#FFF7E0;border-color:transparent;color:#6B5200}
.tag.escura{background:var(--preto);color:var(--verde);border-color:var(--preto)}
.suave{color:var(--suave)}
.pend{color:#8A6D00;font-weight:600}
.verm{color:#9B1C1C}
.pos{color:var(--verde-tinta)}
small{font-size:12px}

.lista-prod{max-height:470px;overflow:auto;border:1px solid var(--linha);border-radius:8px}
.lista-prod .item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--linha)}
.lista-prod .item:last-child{border-bottom:0}
.lista-prod .item .nome{flex:1;min-width:0;font-size:14px}
.lista-prod .item .nome small{display:block;color:var(--suave)}
.carrinho .linha{display:grid;grid-template-columns:96px 1fr 1fr 22px;gap:6px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--linha);font-size:14px}
.carrinho .linha .nm{grid-column:1/4}
.carrinho .linha small{display:block;color:var(--suave)}
.qtd{display:flex;align-items:center;border:1px solid var(--linha);border-radius:6px}
.qtd button{border:0;background:none;width:24px;height:28px;font-weight:700}
.qtd input{width:38px;border:0;text-align:center;padding:0}
.preco-in{width:100%;border:1px solid var(--linha);border-radius:6px;padding:4px 6px;text-align:right}
.preco-in.flex{border-color:#E0B000;background:#FFFBEA}
.total{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;gap:10px}
.total.grande{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--tinta);border-top:2px solid var(--tinta);margin-top:6px;padding-top:10px}
.x{border:0;background:none;color:var(--suave);font-size:18px;line-height:1}
.info-cli{background:var(--papel-frio);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px}

.funil{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.coluna{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:12px;min-height:220px}
.coluna h3{font-size:14px;display:flex;justify-content:space-between;margin-bottom:10px}
.ficha{background:var(--papel-frio);border:1px solid var(--linha);border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px;cursor:grab}
.ficha b{display:block;color:var(--tinta);font-size:14px}
.coluna.alvo{outline:2px dashed var(--verde-fundo)}

.celular{width:320px;max-width:100%;margin:0 auto;background:var(--preto);border-radius:34px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.tela{background:var(--papel-frio);border-radius:24px;overflow:hidden;height:600px;display:flex;flex-direction:column}
.tela .bar{background:var(--preto);color:var(--on-dark);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.tela .sinal{font-weight:700}.tela .sinal.on{color:var(--verde)}.tela .sinal.off{color:#FF8A8A}
.tela .corpo{flex:1;overflow:auto;padding:12px}
.tela .cli{background:var(--papel);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px;border:1px solid var(--linha)}
.tela .cli b{color:var(--tinta);font-size:14px}
.tela .fila{background:#FFF7E0;color:#5C4A00;font-size:12px;padding:8px 12px}

.forma{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--linha);gap:10px}
.forma:last-child{border-bottom:0}
.forma input.campo{width:130px;text-align:right}

.carga{border:1px solid var(--linha);border-radius:12px;background:var(--papel);padding:16px;margin-bottom:14px}
.carga .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seq{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--linha);font-size:14px}
.seq:last-child{border-bottom:0}
.seq .n{width:26px;height:26px;border-radius:99px;background:var(--preto);color:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.seq .mv{display:flex;flex-direction:column}
.seq .mv button{border:0;background:none;font-size:11px;line-height:1;padding:1px 4px;color:var(--suave)}

.modal-fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal-fundo.aberto{display:flex}
.modal{background:var(--papel);border-radius:14px;padding:22px;width:560px;max-width:100%;max-height:90vh;overflow:auto}
.modal.largo{width:900px}
.modal pre{white-space:pre-wrap;font-family:var(--font-body);background:#E7F8DA;border-radius:10px;padding:14px;font-size:14px;margin:12px 0}
.modal .rodape-m{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--preto);color:var(--verde);padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.vis{opacity:1}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;padding:3px 0}

.mob-top{display:none}
.acao{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha);font-size:14px;cursor:pointer}
.acao:last-child{border-bottom:0}
.acao:hover b{text-decoration:underline}
.acao .ic{width:30px;height:30px;border-radius:8px;background:var(--preto);color:var(--verde);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.acao .ic.alerta{background:#9B1C1C;color:#fff}
.tempo{border-left:2px solid var(--linha);margin-left:6px;padding-left:14px}
.tempo div{position:relative;padding:5px 0;font-size:13px}
.tempo div::before{content:"";position:absolute;left:-20px;top:10px;width:10px;height:10px;border-radius:99px;background:var(--verde-fundo)}
.passos{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.passos span{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--papel-frio);color:var(--suave);border:1px solid var(--linha)}
.passos span.ok{background:var(--verde-veu);color:var(--verde-tinta);border-color:transparent}
.passos span.agora{background:var(--preto);color:var(--verde);border-color:var(--preto)}

/* ---------- marca: estampa M7, faixa preta e moldura verde ---------- */
.lado{background:linear-gradient(rgba(0,0,0,.93),rgba(0,0,0,.97)),url(assets/padrao-m7.png) center/340px repeat}
.lado .seg{font-family:var(--font-desc);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--verde);margin-top:10px;line-height:1.5;font-weight:700}
.lado nav button.ativo{background:var(--verde-veu);color:var(--verde);box-shadow:inset 3px 0 0 var(--verde)}
.hero{position:relative;margin:-26px -32px 22px;padding:30px 32px 26px;background:#000;color:var(--on-dark-2);overflow:hidden;border-bottom:4px solid var(--verde);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hero::before{content:"";position:absolute;inset:0;background:url(assets/padrao-m7.png) right center/560px auto repeat;opacity:.16}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 30%,rgba(0,0,0,.6) 100%)}
.hero>*{position:relative;z-index:1}
.hero .seg{font-family:var(--font-desc);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--verde);margin-bottom:8px;font-weight:700}
.hero h1{color:#fff;font-size:42px}
.hero h1 em{font-style:normal;color:var(--verde)}
.hero p{color:var(--on-dark-dim);margin-top:6px}
.hero .acoes{display:flex;gap:8px;flex-wrap:wrap}
.hero .btn{background:var(--grafite-2);color:var(--on-dark);border-color:var(--linha-escura)}
.hero .btn:hover{border-color:var(--verde)}
.hero .btn.prim,.hero .btn.verde{background:var(--verde);color:#000;border-color:var(--verde)}
.cartao h2::before{content:"";display:inline-block;width:10px;height:10px;background:var(--verde);border-radius:2px;margin-right:9px;vertical-align:3px}
.kpi:not(.escuro){border-top:4px solid var(--verde)}
.kpi.escuro{background:linear-gradient(rgba(0,0,0,.86),rgba(0,0,0,.9)),url(assets/padrao-m7.png) center/300px;border:2px solid var(--verde)}
.moldura{border:2px solid var(--verde)!important;border-radius:14px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#fff;flex:none;border:1px solid var(--linha);display:inline-flex;align-items:center;justify-content:center}
.thumb.sem{background:#000;color:var(--verde);font-family:var(--font-display);font-weight:800;font-size:15px;border-color:#000}
.thumb.g{width:150px;height:150px;border-radius:12px;font-size:40px}
td .prodcel{display:flex;gap:10px;align-items:center}

/* ---------- atendimento (caixa de entrada do WhatsApp) ---------- */
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 290px;background:var(--papel);border:1px solid var(--linha);border-radius:12px;overflow:hidden;height:72vh;min-height:560px}
.inbox .col{border-right:1px solid var(--linha);overflow:auto}
.inbox .col:last-child{border-right:0;padding:16px}
.conv{padding:12px 14px;border-bottom:1px solid var(--linha);cursor:pointer;font-size:13px}
.conv:hover{background:var(--papel-frio)}
.conv.on{background:var(--verde-veu);box-shadow:inset 3px 0 0 var(--verde)}
.conv .l1{display:flex;justify-content:space-between;gap:8px}
.conv b{color:var(--tinta);font-size:14px}
.conv .prev{color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 4px}
.thread{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--linha)}
.thread .cab{padding:12px 16px;border-bottom:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#EFEAE2}
.msg{max-width:80%;padding:8px 11px;border-radius:10px;font-size:14px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08);line-height:1.4}
.msg.cli{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.msg.nos{background:#D9FDD3;align-self:flex-end;border-top-right-radius:2px}
.msg.sis{align-self:center;background:#000;color:var(--verde);font-size:12px;font-weight:600;border-radius:99px;padding:4px 12px}
.msg small{display:block;text-align:right;color:var(--suave);font-size:11px;margin-top:2px}
.macros{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.macros button{border:1px solid var(--linha);background:var(--papel-frio);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600}
.macros button:hover{border-color:var(--verde-fundo)}
.resp{display:flex;gap:8px;padding:10px 12px 12px}
.resp textarea{flex:1;resize:none}
.sla{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap}
.sla.ok{background:var(--verde-veu);color:var(--verde-tinta)}.sla.atencao{background:#FFF7E0;color:#6B5200}.sla.estourou{background:#FDECEC;color:#9B1C1C}
.estrelas{color:#E0A800;letter-spacing:1px}
.roteiro .seq .n.ok{background:var(--verde);color:#000}
/* ---------- v0.7: robô, filas, etiquetas, agendadas, equipe, sininho, mini gráfico ---------- */
.etq{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:color-mix(in srgb,var(--c) 80%,#000);background:transparent;white-space:nowrap}
.etq::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.etq.on{background:color-mix(in srgb,var(--c) 16%,#fff);border-color:transparent}
.etq:not(.on){opacity:.55}.etq.mais::before{display:none}.etq.mais{background:var(--papel-frio)}.etq[onclick]{cursor:pointer}.etq[onclick]:hover{opacity:1}
.fila-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--c)}
.fila-chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.msg.bot{background:#E7F0FF;align-self:flex-end;border-top-right-radius:2px}
.msg.int{background:#FFF3C4;align-self:flex-end;border:1px dashed #D9B200;max-width:70%}
.msg.int::before{content:"Nota interna · o cliente não vê";display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7A6200;margin-bottom:2px}
.msg.eq .quem{display:block;font-size:12px;color:var(--verde-tinta)}
.msg .na-conv{display:block;font-size:12px;margin-top:4px}
.mencao{color:#1F5FBF}
.simula{background:#E7F0FF;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;border-top:1px solid var(--linha)}
.modo-resp{display:flex;gap:4px;padding:8px 12px 0}
.modo-resp button{border:0;background:none;font-weight:700;font-size:12px;padding:4px 10px;border-radius:99px;color:var(--suave)}
.modo-resp button.on{background:var(--preto);color:var(--verde)}.modo-resp button.on.int{background:#FFF3C4;color:#7A6200}
.resp.int textarea{background:#FFFBEA}
.sino{position:relative;padding:9px 11px}
.sino .bolinha{position:absolute;top:-6px;right:-6px;background:#E53935;color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 5px;border:2px solid #000}
.notif{position:fixed;top:70px;right:24px;width:380px;max-width:calc(100vw - 32px);max-height:70vh;overflow:auto;background:var(--papel);border:1px solid var(--linha);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.25);z-index:60;display:none}
.notif.aberto{display:block}
.notif .n-cab{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linha);position:sticky;top:0;background:var(--papel);font-size:13px}
.n-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--linha);cursor:pointer;font-size:13px;opacity:.6}
.n-item.nao{opacity:1;background:color-mix(in srgb,var(--verde) 8%,transparent)}
.n-item:hover{background:var(--papel-frio)}
.n-item small{display:block;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-item em{font-style:normal;font-size:11px;color:var(--suave)}
.n-item .ic{flex:none;width:30px;height:30px;border-radius:8px;background:var(--papel-frio);display:grid;place-items:center;font-weight:800;font-size:12px}
.n-item .ic.alerta{background:#FDECEC;color:#9B1C1C}

<script>
/* ============================================================
   Sistema M7 · protótipo v0.6 (12/10/2026)
   v0.6: crédito do cliente na tela, contatos com aniversário, agenda de compromissos, automações,
   visita registrada no pedido, mapa da carteira, comissão sobre faturado ou recebido, notas de compra
   capturadas (custo e NCM), ponto de pedido, curva ABC, prontidão fiscal e NF-e por API fiscal.
   Produtos: cadastro real (produtos.js, gerado de auditoria/ + export do Pedidook de 07/10/2026):
   nome, categoria, preço, custo, estoque, NCM, CEST e EAN são da M7.
   Anúncios: reais (anuncios.js, gerado das fichas em mercado-livre/): MLB, preço, plano, sobra e kit.
   As duas vendas da bobina Thega no ML (25/09 e 02/10) são reais.
   Clientes, vendedores, pedidos, cargas, títulos, contas a pagar, extrato, perguntas e regras
   comerciais são de EXEMPLO, guardados no navegador só para a demonstração funcionar.
   Estoque: físico = Pedidook de 07/10 + movimentos feitos no sistema. Disponível = físico − reservado
   (pedido aberto reserva; a nota fiscal baixa).
   ============================================================ */
const P = window.PRODUTOS || [];
const porCod = Object.fromEntries(P.map(p => [p.c, p]));
const AN = window.ANUNCIOS || [];
// quanto o ML repassa por venda: o lido na tela, ou a conta inversa da sobra (sobra = repasse − 6% − R$ 1,20 − custo base)
function repasseAn(a){ return a.recebe ?? (a.sobra!=null && a.custo_base!=null ? Math.round((a.sobra + a.preco*0.06 + 1.2 + a.custo_base)*100)/100 : null); }
const SLA_MIN = 15;   // meta de 1ª resposta no WhatsApp, em minutos
/* ---------- nicho do cliente: o que oferecer, pelas subcategorias reais do catálogo ---------- */
const NICHOS = {
  'Hamburgueria':             {quem:'as hamburguerias', kw:/hamb|lanche|batata|sach|ketchup|maionese|mostarda|guardanapo/i, subs:['Embalagens para lanche','Papel para alimentos e saco SOS','Caixas de papelão para delivery','Molhos e condimentos','Guardanapos','Copos','Canudos, espetos e palitos','Luvas']},
  'Pizzaria':                 {quem:'as pizzarias', kw:/pizza|disco|sach|oregano|ketchup|guardanapo/i, subs:['Caixas de papelão para delivery','Papel para alimentos e saco SOS','Molhos e condimentos','Temperos e especiarias','Guardanapos','Talheres descartáveis','Sacolas plásticas','Copos']},
  'Restaurante / marmitaria': {quem:'os restaurantes', kw:/marmit|quentinh|talher|garfo|faca|aluminio|tampa/i, subs:['Marmitas e quentinhas','Talheres descartáveis','Tampas','Potes e cumbucas','Papel alumínio','Sacolas plásticas','Guardanapos','Luvas','Máscaras, toucas e proteção']},
  'Lanchonete':               {quem:'as lanchonetes', kw:/lanche|copo|canudo|guardanapo|salgad|sach/i, subs:['Embalagens para lanche','Copos','Canudos, espetos e palitos','Guardanapos','Papel para alimentos e saco SOS','Molhos e condimentos','Snacks e salgadinhos','Bebidas']},
  'Açougue':                  {quem:'os açougues', kw:/bandeja|bobina|picotad|filme|etiqueta|vacuo|luva/i, subs:['Bandejas','Bobinas','Sacos plásticos','Filmes e plástico bolha','Sacos a vácuo e zip','Etiquetas e etiquetadoras','Luvas']},
  'Padaria / confeitaria':    {quem:'as padarias e confeitarias', kw:/forminha|bolo|torta|saco|papel|recheio|cobertura/i, subs:['Forminhas e bases de confeitaria','Sacos de papel','Papel para alimentos e saco SOS','Recheios e coberturas','Preparados, ligas e corantes','Granulados e decoração','Bandejas','Potes e cumbucas']},
  'Sorveteria / açaiteria':   {quem:'as sorveterias e açaiterias', kw:/aca[ií]|sorvete|copo|colher|cumbuca|pote|cobertura|granulado/i, subs:['Açaí e sorveteria','Potes e cumbucas','Copos','Talheres descartáveis','Recheios e coberturas','Granulados e decoração','Chocolate nobre e cobertura','Canudos, espetos e palitos']},
  'Bar':                      {quem:'os bares', kw:/copo|espeto|palito|guardanapo|petisco|amendoim/i, subs:['Copos','Canudos, espetos e palitos','Guardanapos','Snacks e salgadinhos','Bebidas','Pratos','Papel toalha e interfolha']},
  'Mercearia / mercado':      {quem:'as mercearias', kw:/sacola|bobina|etiqueta|bala|chocolate/i, subs:['Sacolas plásticas','Bobinas','Etiquetas e etiquetadoras','Sacos plásticos','Balas','Chocolates','Snacks e salgadinhos','Desinfetantes e limpadores']},
  'Festa e eventos':          {quem:'quem faz festa', kw:/festa|prato|copo|garfo|toalha|forminha|vela/i, subs:['Artigos de festa','Copos','Pratos','Talheres descartáveis','Guardanapos','Toalhas de mesa','Forminhas e bases de confeitaria','Balas']},
  'Limpeza / empresa':        {quem:'as empresas e condomínios', kw:/papel|saco de lixo|desinfet|detergente|cloro|rodo|vassoura/i, subs:['Desinfetantes e limpadores','Detergentes e sabões','Papel higiênico','Papel toalha e interfolha','Sacos de lixo','Alvejantes e cloro','Vassouras, rodos e pás','Panos e flanelas']}
};
const nichoDe = c => c?.nicho && NICHOS[c.nicho] ? c.nicho : null;
// produtos do nicho em estoque que o cliente ainda não compra; sobe quem outros clientes do mesmo nicho já compram
function ofertasNicho(id, n=8){
  const c = cliente(id), ni = nichoDe(c); if (!ni) return [];
  const conf = NICHOS[ni], ja = new Set(E.pedidos.filter(p=>p.cli===id).flatMap(p=>p.itens.map(i=>i.c)));
  const pares = new Set(E.clientes.filter(x=>x.id!==id && x.nicho===ni).map(x=>x.id)), comprados = {};
  E.pedidos.filter(p=>pares.has(p.cli) && !NAO_VENDA.includes(p.status)).forEach(p=>new Set(p.itens.map(i=>i.c)).forEach(k=>comprados[k]=(comprados[k]||0)+1));
  const cands = P.filter(p=>conf.subs.includes(p.sub) && !ja.has(p.c) && estD(p)>0 && p.p>0)
    .map(p=>({p, pares:comprados[p.c]||0, s:(comprados[p.c]||0)*10 + (conf.kw.test(p.n)?4:0) + (p.f?2:0) + 3*(conf.subs.length-conf.subs.indexOf(p.sub))/conf.subs.length + (margem(p)>.25?1:0)}))
    .sort((a,b)=>b.s-a.s);
  const porSub = {}, out = [];
  for (const x of cands){ if ((porSub[x.p.sub]||0) >= 2) continue; porSub[x.p.sub] = (porSub[x.p.sub]||0)+1; out.push(x); if (out.length >= n) break; }
  return out;
}
// mesmo tipo de produto, com estoque, do preço mais parecido para o mais longe
function similares(cod, n=4){ const p=porCod[cod]; if(!p) return []; return P.filter(x=>x.sub===p.sub && x.c!==p.c && estD(x)>0 && x.p>0).sort((a,b)=>Math.abs(a.p-p.p)-Math.abs(b.p-p.p)).slice(0,n); }
function textoOferta(id, L){
  const c = cliente(id), ni = nichoDe(c);
  return `Olá, ${String(c.nome).split(' ')[0]}! Aqui é da M7 Distribuidora.\nSeparei alguns produtos que ${ni?NICHOS[ni].quem:'nossos clientes'} costumam levar e que temos em estoque:\n\n` + L.map(x=>`• ${x.p.n} · ${brl(precoCalc(x.p,c,1).p)}`).join('\n') + `\n\nQuer que eu inclua no próximo pedido?`;
}
function ofertaWhats(id){
  const L = ofertasNicho(id, 5); if (!L.length) return toast('Defina o nicho do cliente na ficha');
  const t = textoOferta(id, L), cv = E.conversas.find(x=>x.cli===id && x.status!=='resolvida');
  modal(`<h2>Oferta para ${esc(cliente(id).nome)}</h2><p class="suave">${esc(nichoDe(cliente(id)))} · só produto com estoque</p><pre>${esc(t)}</pre><div class="rodape-m"><button class="btn" onclick="navigator.clipboard?.writeText(${JSON.stringify(t).replace(/"/g,'&quot;')}).then(()=>toast('Texto copiado'))">Copiar</button>${cv?`<button class="btn verde" onclick="fecharModal();convSel=${cv.id};abaAt='conversas';ir('atendimento');setTimeout(()=>{const el=document.getElementById('resp');if(el){el.value=${JSON.stringify(t).replace(/"/g,'&quot;')};macroUsada='oferta';}},50)">Pôr na conversa aberta</button>`:''}<button class="btn prim" onclick="fichaCli(${id})">Voltar</button></div>`);
}
const NICHO_PADRAO = {1:'Restaurante / marmitaria', 2:'Mercearia / mercado', 3:'Lanchonete', 4:'Padaria / confeitaria', 6:'Restaurante / marmitaria', 7:'Mercearia / mercado', 8:'Açougue', 9:'Pizzaria', 10:'Hamburgueria', 11:'Sorveteria / açaiteria', 12:'Bar'};

/* ---------- histórico de conversas de EXEMPLO para o relatório dos atendentes ---------- */
// cada atendente com um jeito: rapidez, se cumprimenta, se oferece produto, se encerra, se usa resposta pronta
const PERFIS_AT = {Stela:{base:2, var:7, saud:.95, ofer:.6, res:.95, macro:.5}, 'Balcão':{base:5, var:16, saud:.7, ofer:.3, res:.85, macro:.3}, Arthur:{base:10, var:35, saud:.8, ofer:.45, res:.8, macro:.2}, 'Márcio':{base:15, var:70, saud:.5, ofer:.7, res:.7, macro:.05}};
function historicoConversas(est, rnd){
  const cls = est.clientes.filter(c=>c.id!==99), ats = Object.keys(PERFIS_AT), out = [];
  const aberturas = ['Bom dia, tem marmitex N8?','Boa tarde! Quanto está o fardo de bandeja B2?','Oi, entregam em Pains amanhã?','Preciso de copo 200 ml, tem caixa fechada?','Vocês têm sacola personalizada?','Boa tarde, meu pedido ainda não chegou.','Qual o preço da bobina picotada?','Tem pote de açaí 300 ml?'];
  let id = 100;
  for (let d=14; d>=1; d--){
    const n = 2 + Math.floor(rnd()*3);
    for (let k=0; k<n; k++){
      const c = cls[Math.floor(rnd()*cls.length)], at = ats[Math.floor(rnd()*ats.length)], pf = PERFIS_AT[at];
      const ini = new Date(addDias(hoje,-d)+'T12:00:00'); ini.setHours(8+Math.floor(rnd()*10), Math.floor(rnd()*60), 0, 0);
      const t = m => new Date(ini.getTime()+m*60000).toISOString(), dl = () => Math.round(pf.base + rnd()*rnd()*pf.var*2);
      if (rnd() < .06){ out.push({id:++id, cli:c.id, nome:c.nome, fone:'', atendente:null, status:'resolvida', semResp:true, tags:[], csat:null, msgs:[{de:'cli', t:t(0), txt:aberturas[Math.floor(rnd()*aberturas.length)]},{de:'sis', t:t(1440), txt:'Fechada sem resposta'}]}); continue; }
      const msgs = [{de:'cli', t:t(0), txt:aberturas[Math.floor(rnd()*aberturas.length)]}];
      let m = dl(); const frt = m;
      const saud = rnd()<pf.saud, mac = rnd()<pf.macro;
      msgs.push({de:'nos', t:t(m), por:at, macro:mac, txt:(saud?'Olá! Aqui é da M7 Distribuidora. ':'')+'Temos sim, vou te passar o valor.'});
      if (rnd()<.7){ m += 2+Math.floor(rnd()*20); msgs.push({de:'cli', t:t(m), txt:'Fechado, pode mandar.'}); m += dl(); msgs.push({de:'nos', t:t(m), por:at, txt:'Combinado, já separo.'}); }
      const ofer = rnd()<pf.ofer; if (ofer){ m += 1; msgs.push({de:'nos', t:t(m), por:at, oferta:true, txt:'Separei também umas sugestões do catálogo que combinam com o seu negócio.'}); }
      const virou = rnd() < .3 + (ofer?.2:0) + (frt<=SLA_MIN?.1:0), valor = virou ? r2(150 + rnd()*1350) : 0;
      if (virou) msgs.push({de:'sis', t:t(m+2), txt:'Pedido criado · '+brl(valor)});
      const res = rnd()<pf.res, nota = res && rnd()<.75 ? Math.max(1, Math.min(5, (frt<=5?5:frt<=15?4:frt<=60?3:2) + (rnd()<.3?1:0) - (rnd()<.15?1:0))) : null;
      if (res) msgs.push({de:'sis', t:t(m+5), txt:'Conversa resolvida'});
      out.push({id:++id, cli:c.id, nome:c.nome, fone:'', atendente:at, status:'resolvida', semFim:!res, tags:virou?['pedido criado']:[], csat:nota, valorPedido:valor||null, msgs});
    }
  }
  return out;
}

/* ---------- crédito do cliente: quanto ainda pode pedir a prazo ---------- */
function credito(id){
  const c = cliente(id), usado = r2(abertoCli(id)), venc = vencidosCli(id);
  return {limite:c?.limite||0, usado, disp:r2((c?.limite||0) - usado), venc:venc.length, vVenc:r2(venc.reduce((s,t)=>s+t.valor,0))};
}
function creditoHTML(id, compacto){
  const k = credito(id);
  if (!k.limite && !k.usado) return compacto ? '<small class="suave">Sem limite: só à vista</small>' : `<div class="credito"><b>Sem limite de crédito</b><br><small class="suave">Só compra à vista. O limite fica na ficha do cliente.</small></div>`;
  const ruim = k.venc || k.disp <= 0, uso = k.limite ? Math.min(100, k.usado/k.limite*100) : 100;
  return `<div class="credito ${ruim?'ruim':''}"><div class="l"><span class="rot">Pode pedir a prazo</span>${k.venc?`<span class="tag alerta">${k.venc} vencido(s) · ${brl(k.vVenc)}</span>`:''}</div>
    <div class="disp">${brl(Math.max(0,k.disp))}</div>
    <div class="barra cred ${k.disp<=0?'cheia':''}"><i style="width:${uso}%"></i></div>
    <div class="l" style="margin-top:4px"><small class="suave">limite ${brl(k.limite)}</small><small class="suave">em aberto ${brl(k.usado)}</small></div>
    ${ruim&&!compacto?`<small class="verm">${k.venc?'Com boleto vencido, pedido a prazo vai para o Márcio liberar.':'Limite tomado: pedido a prazo vai para o Márcio liberar.'}</small>`:''}</div>`;
}
// o que impede um pedido a prazo de sair direto: boleto vencido ou limite estourado
function travaCredito(cliId, cond, tot){
  if (cond==='avista') return '';
  const k = credito(cliId);
  if (k.venc) return `${cliente(cliId).nome} tem ${k.venc} boleto(s) vencido(s) (${brl(k.vVenc)}).`;
  if (k.limite && k.usado + tot > k.limite + 0.005) return `Passa do limite de crédito: pode pedir ${brl(Math.max(0,k.disp))} a prazo e o pedido é de ${brl(tot)}.`;
  return '';
}

/* ---------- automações: o sistema abre a tarefa sozinho ---------- */
let autoRodou = false;
function rodarAutomacoes(){
  if (autoRodou || !E.automacoes) return 0; autoRodou = true;
  const on = id => E.automacoes.find(a=>a.id===id)?.on, novas = [];
  E.autoFeitas = E.autoFeitas || {};
  const nova = (cli, txt, resp, auto) => { E.tarefas.push({id:Math.max(0,...E.tarefas.map(x=>x.id))+1, cli, data:hoje, txt, resp, feita:null, auto}); novas.push(txt); reg(`Automação abriu tarefa · ${cliente(cli)?.nome}: ${txt}`, {cli}); };
  const temAberta = (cli, auto) => E.tarefas.some(t=>t.cli===cli && !t.feita && (!auto || t.auto===auto));
  if (on('recompra')) recompra().forEach(r=>{ const ch = 'recompra|'+r.c.id+'|'+mesAtual; if(!temAberta(r.c.id) && !E.autoFeitas[ch]){ nova(r.c.id, `Passou do ritmo de compra: ${r.dias} dias sem comprar. Ligar ou visitar.`, r.c.vend, 'recompra'); E.autoFeitas[ch] = hoje; } });
  if (on('parada')) E.clientes.filter(c=>ABERTAS.includes(c.etapa) && !temAberta(c.id)).forEach(c=>nova(c.id, 'Retomar a negociação: estava sem próximo passo.', c.vend, 'parada'));
  if (on('vencido')) [...new Set(E.titulos.filter(t=>!t.pago && t.venc<addDias(hoje,-3)).map(t=>t.cli))].forEach(cli=>{ if(!temAberta(cli,'vencido')) nova(cli, `Cobrar o boleto vencido de ${brl(vencidosCli(cli).reduce((s,t)=>s+t.valor,0))}.`, 'loja', 'vencido'); });
  if (novas.length) salvar();
  return novas.length;
}

  const X = ln => (ln-ln0)/(ln1-ln0)*W, Y = la => (la1-la)/(la1-la0)*H, jit = (id,k) => ((id*9301 + k*49297) % 233280)/233280 - .5;

const vendaDia = (c, dias=30) => E.pedidos.filter(x=>x.data>=addDias(hoje,-dias) && !NAO_VENDA.includes(x.status)).reduce((s,x)=>s+x.itens.filter(i=>i.c===c).reduce((a,i)=>a+i.q,0),0)/dias;
const leadForn = f => E.forn?.[f]?.lead ?? E.regras.leadPadrao;
// ponto de pedido = venda por dia × (prazo do fornecedor + dias de segurança). Sugestão: o que cobre prazo + cobertura, menos o disponível
function reposicao(p){
  const d = estD(p); if (d==null) return null;
  const m = vendaDia(p.c), lead = leadForn(p.forn||'Sem fornecedor');
  const ponto = Math.ceil(m*(lead+E.regras.segDias)), sug = m>0 ? Math.max(0, Math.ceil(m*(lead+E.regras.cobertura)) - Math.floor(d)) : null;
  return {m, lead, ponto, sug, d, precisa:(m>0 && d<=ponto) || d<=(p.min||0)};
}
let _abc = null;
function curvaABC(dias=90){
  const v = {};
  E.pedidos.filter(x=>x.data>=addDias(hoje,-dias) && !NAO_VENDA.includes(x.status)).forEach(x=>x.itens.forEach(i=>v[i.c]=(v[i.c]||0)+i.q*i.p));
  const L = Object.entries(v).sort((a,b)=>b[1]-a[1]), tot = L.reduce((s,x)=>s+x[1],0) || 1, cls = {}, acum = {};
  let ac = 0; L.forEach(([c,val])=>{ const antes = ac/tot; ac += val; acum[c] = ac/tot; cls[c] = antes < .8 ? 'A' : antes < .95 ? 'B' : 'C'; });

}

/* ---------- regras de preço ---------- */
const cliente = id => E.clientes.find(c => c.id == id);
const vendedor = id => E.vendedores.find(v => v.id === id);
const VEND = () => E.vendedores.filter(v => !v.canal);          // o Mercado Livre é canal, não vendedor com meta
const perfil = () => E.perfis.find(p=>p.id===E.usuario) || E.perfis[0];
const TELAS_DE = () => perfil().telas;
const veCusto = () => perfil().custo;
const aprova = () => !!perfil().aprova;
function precoCalc(prod, cli, q=1, est=E){
  if (cli?.esp?.[prod.c] != null) return {p:cli.esp[prod.c], regra:'preço especial do cliente'};
  let v = prod.p ?? 0; const regras=[];
  const tab = est.tabelas.find(t => t.id === cli?.tabela);
  if (tab?.ajuste) { v *= 1 + tab.ajuste/100; regras.push(tab.nome); }
  if (cli?.desc) { v *= 1 - cli.desc/100; regras.push('cliente −'+cli.desc+'%'); }
  const fx = est.faixas.filter(f => (!f.cat || f.cat===prod.cat) && q >= f.min).sort((a,b)=>b.desc-a.desc)[0];
  if (fx) { v *= 1 - fx.desc/100; regras.push(`a partir de ${fx.min} un −${fx.desc}%`); }
  return {p:r2(v), regra:regras.join(' · ') || 'preço de tabela'};
}
function subtotal(ped){ return ped.itens.reduce((s,i)=>s+i.q*i.p,0); }
function totalPedido(ped){ return r2(subtotal(ped)*(1+(ped.acresc||0)/100)); }

const flexPedido = ped => ped.itens.reduce((s,i)=>s+(i.p-(i.tab??i.p))*i.q,0);
const NAO_VENDA = ['cancelado','aguardando'];
const doMes = p => p.data.slice(0,7)===mesAtual && !NAO_VENDA.includes(p.status);
function vendidoVend(vid){ return E.pedidos.filter(p=>p.vend===vid && doMes(p)).reduce((s,p)=>s+totalPedido(p),0); }
function saldoFlex(vid){ const v=vendedor(vid); return (v?.verba||0) + E.pedidos.filter(p=>p.vend===vid && doMes(p)).reduce((s,p)=>s+flexPedido(p),0); }
function comissaoDe(valor){ const f = E.comissao.find(f=>f.ate==null || valor<=f.ate) || E.comissao[E.comissao.length-1]; return {pct:f.pct, valor:valor*f.pct/100}; }
const condNome = id => E.condicoes.find(c=>c.id===id)?.nome || id;

/* ---------- estoque: físico, reservado e disponível ----------
   físico = Pedidook (07/10) + movimentos do sistema (nota fiscal baixa, entrada de compra soma, Full tira da loja)
   reservado = pedido aberto que ainda não tem nota. disponível = físico − reservado. */
const ABERTO = ['aguardando','novo','separando'];
function reservas(){ if(_res) return _res; _res={}; E.pedidos.forEach(p=>{ if(ABERTO.includes(p.status)) p.itens.forEach(i=>_res[i.c]=(_res[i.c]||0)+i.q); }); return _res; }
function movs(){ if(_mov) return _mov; _mov={}; E.mov.forEach(m=>_mov[m.c]=(_mov[m.c]||0)+m.q); return _mov; }
const estF = p => p?.est==null ? null : r2(p.est + (movs()[p.c]||0));
const estR = p => r2(reservas()[p?.c]||0);
const estD = p => p?.est==null ? null : r2(estF(p) - estR(p));
function mover(c, q, tipo, ref){ E.mov.push({data:hoje, c, q:r2(q), tipo, ref}); _mov=null; }
const estTag = p => { const d=estD(p); if(d==null) return '<span class="tag">sem dado</span>'; const r=estR(p); return `<span class="tag ${d<=0?'alerta':d<=(p.min||3)?'esp':''}" title="físico ${n0(estF(p))} · reservado ${n0(r)}">${n0(d)}</span>${r?`<br><small class="suave">${n0(r)} reserv.</small>`:''}`; };
const margem = p => p.custo && p.p ? (p.p-p.custo)/p.p : NaN;

/* ---------- nota fiscal, cancelamento e liberação de desconto ---------- */
function faltaFiscal(ped){ return ped.itens.map(i=>porCod[i.c]).filter(p=>prontidao(p).length); }
function faturar(id){
  const p = E.pedidos.find(x=>x.id===id); if(!p || p.nf) return;
  const sem = faltaFiscal(p);
  if (sem.length) return modal(`<h2>Nota travada</h2><p>Falta dado fiscal no cadastro de ${sem.length} produto(s). A SEFAZ recusa a nota sem ele.</p>${sem.map(x=>`<div class="forma"><span>${esc(x?.n||'?')}<br><small class="suave">cód. ${x?.c}</small></span><span class="tag alerta">falta ${prontidao(x).join(' e ')}</span></div>`).join('')}<div class="rodape-m"><button class="btn prim" onclick="fecharModal()">Entendi</button></div>`);
  p.nf = {n:++E.nfSeq, data:hoje, xml:true, chave:chaveNF(), api:true, mlEnviada: !!p.ml};
  p.itens.forEach(i=>mover(i.c, -i.q, 'venda', p.id));
  p.status = 'faturado';
  reg(`Emitiu a NF-e ${p.nf.n} do pedido #${p.id}`, {ped:p.id, cli:p.cli});
  salvar(); fecharModal(); ir(tela); toast(`NF-e ${p.nf.n} autorizada pela API fiscal (homologação)${p.ml?' e XML enviado ao ML':''}. Estoque baixado.`);
}
function cancelar(id){
  const p = E.pedidos.find(x=>x.id===id); if(!p || p.status==='cancelado') return;
  if (p.ml?.etiqueta && p.status!=='entregue' && !confirm('Este pedido já tem etiqueta. Se o pacote já saiu, avise a expedição para segurar. Cancelar mesmo assim?')) return;
  if (p.nf) p.itens.forEach(i=>mover(i.c, i.q, 'devolução', p.id));
  E.titulos = E.titulos.filter(t=>t.ped!==p.id || t.pago);
  p.status = 'cancelado';
  reg(`Cancelou o pedido #${p.id}${p.nf?` e a NF-e ${p.nf.n} (estoque devolvido)`:''}`, {ped:p.id, cli:p.cli});
  salvar(); fecharModal(); ir(tela); toast('Pedido #'+id+' cancelado');
}
function liberar(id, ok){
  const p = E.pedidos.find(x=>x.id===id); if(!p || p.status!=='aguardando') return;
  if (ok){ p.status='novo'; gerarTitulos(p, E); p.aprov.por=perfil().nome; p.aprov.em=hoje; reg(`Liberou o desconto do pedido #${p.id}`, {ped:p.id, cli:p.cli}); toast('Pedido #'+id+' liberado'); }
  else { p.status='cancelado'; p.aprov.recusado=hoje; reg(`Recusou o desconto do pedido #${p.id}`, {ped:p.id, cli:p.cli}); toast('Pedido #'+id+' recusado. O vendedor é avisado no app.'); }
  salvar(); fecharModal(); ir(tela);
}

/* ---------- custo real por canal ---------- */
// sobra = preço − custo − imposto − (no ML: comissão + custo fixo abaixo de R$ 79 + embalagem)
function contaCanal(prod, preco, canal, plano='Clássico'){
  const R=E.regras, custo=prod?.custo||0, imp=preco*R.imposto/100;
  if (canal==='loja') return {custo, imp, com:0, fixo:0, emb:0, sobra:preco-custo-imp};
  const com=preco*(R.mlComissao[plano]||0)/100, fixo=preco<79?R.mlFixo:0, emb=R.embalagem;
  return {custo, imp, com, fixo, emb, sobra:preco-custo-imp-com-fixo-emb, frete:preco>=79};
}
// menor preço que deixa a margem-alvo, no canal
function precoMinimo(prod, canal, plano='Clássico'){
  const R=E.regras, custo=prod?.custo||0; if(!custo) return null;
  const pct = (R.imposto + R.margemAlvo + (canal==='ml'?(R.mlComissao[plano]||0):0))/100;
  const fixo = canal==='ml' ? R.mlFixo + R.embalagem : 0;
  return pct<1 ? r2((custo+fixo)/(1-pct)) : null;
}

function lerCatalogo(txt){

/* ---------- recompra, positivação e mix ---------- */
function datasCompra(c){ return E.pedidos.filter(p=>p.cli===c.id&&p.status!=='cancelado').map(p=>p.data).concat(c.ultExt?[c.ultExt]:[]).sort(); }
function recompra(){
  return E.clientes.filter(c=>c.tipo==='B2B').map(c=>{
    const ds = datasCompra(c); if(!ds.length) return null;
    const ult = ds[ds.length-1], dias = Math.round((new Date(hoje)-new Date(ult))/864e5);
    const freq = ds.length>1 ? (new Date(ult)-new Date(ds[0]))/864e5/(ds.length-1) : null;
    return dias >= Math.max(7,(freq||7)*1.5) ? {c, dias, freq} : null;
  }).filter(Boolean).sort((a,b)=>b.dias-a.dias);
}
function positivacao(vid){
  const cart = E.clientes.filter(c=>c.vend===vid && ['ativo','inativo'].includes(c.etapa));
  const pos = cart.filter(c=>E.pedidos.some(p=>p.cli===c.id && doMes(p)));
  return {cart:cart.length, pos:pos.length};
}
function mixSugerido(id){
  const c = cliente(id), meus = new Set(E.pedidos.filter(p=>p.cli===id).flatMap(p=>p.itens.map(i=>i.c)));
  const outros = {};
  E.pedidos.filter(p=>p.cli!==id && cliente(p.cli)?.tipo===c.tipo).forEach(p=>new Set(p.itens.map(i=>i.c)).forEach(k=>{ if(!meus.has(k)) outros[k]=(outros[k]||new Set()).add(p.cli); }));
  return Object.entries(outros).map(([k,s])=>[k,s.size]).sort((a,b)=>b[1]-a[1]).slice(0,5);
}

function passos(p){
  const etapas = p.ml ? [['novo','Recebido do ML'],['faturado','Nota'],['etiqueta','Etiqueta'],['rota','Enviado'],['entregue','Entregue']]
                      : [['novo','Pedido'],['separando','Separação'],['faturado','Nota'],['rota','Entrega'],['entregue','Entregue']];
  const ordem = ['aguardando','novo','separando','faturado','rota','entregue'];
  const at = p.ml && p.status==='faturado' && p.ml.etiqueta ? 2.5 : ordem.indexOf(p.status);

/* clientes reais que pararam de comprar (relatório Venda geral do Pedidook): o primeiro quadro do Bom dia */
let sumVerTudo = false;
function sumidosReais(){
  if (!VR()) return null;
  const g = {};
  VR().forEach(p=>{ if (p.tipo!=='Orçamento' && !/consumidor final/i.test(p.nome)) (g[p.cli] = g[p.cli] || []).push(p); });
  return Object.entries(g).map(([cli,ps])=>{
    const ds = ps.map(p=>p.data).sort(), ult = ds[ds.length-1], dias = Math.round((new Date(hoje)-new Date(ult))/864e5);
    const freq = ds.length>1 ? (new Date(ult)-new Date(ds[0]))/864e5/(ds.length-1) : null;
    const tot = ps.reduce((s,p)=>s+p.total,0), meses = Math.max(3, (new Date(ult)-new Date(ds[0]))/864e5/30.4);   // pelo menos 3 meses, para quem comprou muito em poucas semanas não inflar a média
    const grupo = dias>90 ? 'sumiu' : (freq && dias>Math.max(30, freq*1.5)) ? 'atrasado' : null;
    const ano = ps.filter(p=>p.data>addDias(hoje,-365)).reduce((s,p)=>s+p.total,0);
    return {cli, ano, nome:ps[ps.length-1].nome, cid:ps[ps.length-1].cid, vend:cliReal(cli)?.vend?.join(', ')||'', n:ps.length, tot, mes:tot/meses, ult, dias, freq, grupo};
  }).filter(x=>x.grupo && x.n>=3).sort((a,b)=>b.mes-a.mes);   // 3 pedidos ou mais: quem comprou uma vez só não tem ritmo
}

  const L = sumidosReais(); if (!L || !L.length) return '';

VIEWS.inicio = () => {

  ${E.v7oculto?'':novidades7HTML()}
  ${(()=>{ const sv = serieDias(L=>L.reduce((s,p)=>s+totalPedido(p),0)), sp = serieDias(L=>L.length), n = sv.length;

    <div class="cartao kpi escuro"><div class="rot">Vendas de hoje</div><div class="val">${brl(vHoje)}</div>${variacao(sv[n-1], sv[n-2], 'sobre ontem')}${spark(sv, true)}<div class="sub">últimos ${n} dias · ${deHoje.length} pedido(s) hoje</div></div>
    <div class="cartao kpi"><div class="rot">Pedidos de hoje</div><div class="val">${sp[n-1]}</div>${variacao(sp[n-1], sp[n-2], 'sobre ontem')}${spark(sp)}<div class="sub">ticket médio ${brl(sp[n-1]?sv[n-1]/sp[n-1]:0)}</div></div>`; })()}
    <div class="cartao kpi"><div class="rot">Vendas do mês</div><div class="val">${brl(vMes)}</div><div class="sub">projeção ${brl(proj)} · meta ${brl(meta)}</div><div class="barra"><i style="width:${Math.min(100,vMes/meta*100)}%"></i><b style="left:${Math.min(100,diaHoje/diasMes*100)}%" title="onde deveria estar hoje"></b></div></div>
    ${veCusto()?`<div class="cartao kpi"><div class="rot">Lucro bruto do mês</div><div class="val">${brl(vMes-cMes)}</div><div class="sub">margem ${pct((vMes-cMes)/vMes)} · <a href="#" onclick="abaFin='dre';ir('financeiro');return false">resultado</a></div></div>`:''}
    <div class="cartao kpi"><div class="rot">A receber vencido</div><div class="val ${vVenc?'verm':''}">${brl(vVenc)}</div><div class="sub">${venc.length} título(s) · <a href="#" onclick="abaFin='receber';ir('financeiro');return false">ver</a></div></div>
  </div>
  <div class="grade g32" style="margin-top:16px;align-items:start">
    <div class="cartao moldura"><h2>Precisa de você agora</h2>
      ${pend.map(x=>`<div class="acao" onclick="${x.go}"><span class="ic ${x.al?'alerta':''}">${x.ic}</span><span style="flex:1"><b>${esc(x.t)}</b><br><small class="suave">${esc(x.s)}</small></span><span class="suave">›</span></div>`).join('') || '<p class="suave">Nada pendente. Tudo em dia.</p>'}
    </div>
    <div class="cartao"><h2>Vendas por canal no mês</h2>
      ${(()=>{ const m={}; mes.forEach(p=>{const k=p.origem; m[k]=(m[k]||0)+totalPedido(p);}); const mx=Math.max(1,...Object.values(m)); return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(k)}</span><b>${brl(v)}</b></div><div class="barra"><i style="width:${v/mx*100}%"></i></div></div>`).join(''); })()}
      <h2 style="margin-top:18px">Vendedores no mês</h2>
      ${VEND().map(v=>{const vv=vendidoVend(v.id);return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:14px"><b>${esc(v.nome)}</b><span>${brl(vv)} <span class="suave">de ${brl(v.meta)}</span></span></div><div class="barra"><i style="width:${Math.min(100,vv/v.meta*100)}%"></i><b style="left:${diaHoje/diasMes*100}%"></b></div></div>`}).join('')}

  <div class="grade g2" style="margin-top:16px;align-items:start">
    <div class="cartao"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Agenda</h2><button class="btn peq" onclick="novoComp()">+ Compromisso</button></div>

    ${anivHTML()}
  </div>
  <div class="grade g2" style="margin-top:16px">
    <div class="cartao"><h2>Ligar hoje</h2><p class="suave" style="font-size:13px;margin-bottom:6px">Clientes que já deviam ter comprado de novo, pelo ritmo de compra de cada um.</p>
      ${recompra().map(r=>`<div class="forma" style="cursor:pointer" onclick="fichaCli(${r.c.id})"><span><b>${esc(r.c.nome)}</b><br><small class="suave">${esc(vendedor(r.c.vend)?.nome)} · ${r.freq?'compra a cada '+Math.round(r.freq)+' dias':'última compra antes do sistema'}</small></span><span class="tag ${r.dias>30?'alerta':'esp'}">${r.dias} dias sem comprar</span></div>`).join('') || '<p class="suave">Ninguém atrasado.</p>'}
    </div>
    <div class="cartao"><h2>Últimos pedidos</h2><div class="tabela"><table>
      <tr><th>Nº</th><th>Cliente</th><th>Status</th><th class="num">Total</th></tr>
      ${E.pedidos.slice().sort((a,b)=>b.id-a.id).slice(0,7).map(p=>`<tr class="clica" onclick="verPedido(${p.id})"><td>#${p.id}</td><td>${esc(cliente(p.cli)?.nome)}<br><small class="suave">${esc(p.origem)}</small></td><td>${tagStatus(p.status)}</td><td class="num">${brl(totalPedido(p))}</td></tr>`).join('')}

  </div>`;
};

let convSel = 1, filtroConv = 'abertas', abaAt = 'conversas', macroUsada = null, perAt = 7, atSel = '', filtroFila = '', filtroEtq = '';
VIEWS.atendimento = () => {

  if (abaAt==='relatorio' && veCusto()) return topo('Atendimento', 'Como cada atendente responde no WhatsApp: tempo, prazo, padrão, nota do cliente e venda', abas) + relatorioAt();
  if (abaAt==='agendadas') return topo('Atendimento', 'Mensagens que saem sozinhas no dia e na hora marcados', abas) + agendadasHTML();
  if (abaAt==='equipe') return topo('Atendimento', 'A equipe combina aqui, sem o cliente ver', abas) + equipeHTML();
  if (abaAt==='triagem' && aprova()) return topo('Atendimento', 'O robô que recebe o cliente e as filas de cada assunto', abas) + triagemHTML();
  const lista = E.conversas.filter(c=>filtroConv==='todas'||(filtroConv==='abertas'?c.status!=='resolvida':filtroConv==='sem'?!c.atendente&&!c.bot&&c.status!=='resolvida':filtroConv==='robo'?c.bot&&c.status!=='resolvida':c.status==='resolvida'))

  if (!E.conversas.find(c=>c.id===convSel)) convSel = lista[0]?.id;

    <div class="col">
      <div class="filtros" style="padding:10px 12px 0;margin:0 0 8px">${[['abertas','Abertas'],['sem','Sem dono'],['robo','No robô'],['resolvidas','Resolvidas'],['todas','Todas']].map(([k,n])=>`<button class="btn peq ${filtroConv===k?'prim':''}" onclick="filtroConv='${k}';ir('atendimento')">${n}</button>`).join('')}</div>

function dentroHorario(d){
  d = d || new Date(); const h = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'), dia = d.getDay(), H = E.triagem.horario;
  if (dia===0) return false; if (dia===6) return h>=H.ini && h<H.sab; return h>=H.ini && h<H.fim;

function roboRecebe(cv){
  const tr = E.triagem, t = new Date().toISOString();
  if (!tr.on) return;
  if (!dentroHorario()) cv.msgs.push({de:'bot', t, txt:tr.fora});
  if (temCatalogo(cv)){ cv.msgs.push({de:'bot', t, txt:tr.catalogo}); cv.fila = 'pedidos'; cv.bot = null; distribuir(cv); return; }
  cv.msgs.push({de:'bot', t, txt:menuTexto()}); cv.bot = 'menu'; cv.fila = null;
}
function escolherOpcao(id, i){
  const cv = E.conversas.find(c=>c.id===id), op = E.triagem.opcoes[i], t = new Date().toISOString();
  cv.msgs.push({de:'cli', t, txt:String(i+1)});
  cv.msgs.push({de:'bot', t, txt:op.resp});
  cv.bot = null; cv.fila = op.fila;
  cv.msgs.push({de:'sis', t, txt:'Robô passou para a fila ' + (filaDe(op.fila)?.nome || '—')});

  reg(`Robô: ${cv.nome} escolheu "${op.txt}"`, {cli:cv.cli}); salvar(); ir('atendimento');
}
// rodízio: entrega para quem da fila tem menos conversas abertas
function distribuir(cv){
  if (!E.triagem.rodizio || cv.atendente) return;
  const f = filaDe(cv.fila); if (!f || !f.atend.length) return;
  const carga = a => E.conversas.filter(c=>c.atendente===a && c.status!=='resolvida').length;
  cv.atendente = [...f.atend].sort((a,b)=>carga(a)-carga(b))[0];
  cv.msgs.push({de:'sis', t:new Date().toISOString(), txt:'Rodízio: ficou com ' + cv.atendente});

/* ---------- sininho: o que pede atenção em qualquer tela ---------- */
function notificacoes(){
  const L = [], eu = nomeAtual();
  E.conversas.filter(c=>espera(c)>SLA_MIN).forEach(c=>{ const u = [...c.msgs].reverse().find(m=>m.de==='cli'); L.push({k:'sla'+c.id+u.t, ic:'W', al:1, t:`${c.nome} esperando há ${tempo(espera(c))}`, s:(filaDe(c.fila)?.nome||'sem fila')+' · '+(c.atendente||'sem atendente'), q:u.t, go:`convSel=${c.id};abaAt='conversas';filtroConv='abertas';ir('atendimento')`}); });
  E.conversas.filter(c=>c.status!=='resolvida' && !c.atendente && !c.bot && espera(c)<=SLA_MIN && espera(c)>0).forEach(c=>{ const u = [...c.msgs].reverse().find(m=>m.de==='cli'); L.push({k:'nova'+c.id+u.t, ic:'W', t:`Conversa nova sem dono: ${c.nome}`, s:filaDe(c.fila)?.nome||'sem fila', q:u.t, go:`convSel=${c.id};abaAt='conversas';filtroConv='sem';ir('atendimento')`}); });
  feedEquipe().filter(m=>m.de!==eu && new RegExp('@'+eu+'(?![A-Za-zÀ-ú])','i').test(m.txt)).forEach(m=>L.push({k:'men'+m.t, ic:'@', t:`${m.de} te chamou${m.conv?' na conversa de '+m.nome:' no chat da equipe'}`, s:m.txt, q:m.t, go:m.conv?`convSel=${m.conv};abaAt='conversas';filtroConv='todas';ir('atendimento')`:`abaAt='equipe';ir('atendimento')`}));
  (E.agendadas||[]).filter(a=>a.status==='enviada' && a.enviada.slice(0,10)===hoje).forEach(a=>L.push({k:'ag'+a.id, ic:'⏱', t:`Mensagem agendada saiu para ${cliente(a.cli)?.nome}`, s:a.motivo+' · '+a.txt, q:a.enviada, go:`abaAt='agendadas';ir('atendimento')`}));
  pendencias().filter(p=>p.ic!=='W').forEach(p=>L.push({k:'p'+hoje+p.t, ic:p.ic, al:p.al, t:p.t, s:p.s, q:null, go:p.go}));
  return L.sort((a,b)=>(b.q||'').localeCompare(a.q||''));
}

/* ---------- cartões com mini gráfico ---------- */
function serieDias(fn, n=10){ const L = []; for (let d=n-1; d>=0; d--){ const dia = addDias(hoje, -d); L.push(fn(E.pedidos.filter(p=>!NAO_VENDA.includes(p.status) && p.data===dia))); } return L; }
function spark(vals, escuro){
  const w = 220, h = 46, mx = Math.max(1, ...vals), mn = Math.min(...vals), r = mx-mn || 1;
  const pts = vals.map((v,i)=>[i*(w/(vals.length-1||1)), h-4-(v-mn)/r*(h-10)]);
  const linha = pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' '), id = 'sg'+Math.random().toString(36).slice(2,7);
  const cor = escuro ? 'var(--verde)' : 'var(--verde-fundo)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cor}" stop-opacity=".35"/><stop offset="1" stop-color="${cor}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${h} ${linha} ${w},${h}" fill="url(#${id})"/><polyline points="${linha}" fill="none" stroke="${cor}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3" fill="${cor}"/></svg>`;
}
function variacao(a, b, txt){ if (!b) return `<span class="var">${a?'primeiro movimento':'sem movimento'} ${txt}</span>`; const v = (a-b)/b*100; return `<span class="var ${v>=0?'sobe':'desce'}">${v>=0?'▲':'▼'} ${Math.abs(v).toFixed(1).replace('.',',')}% ${txt}</span>`; }

/* ---------- relatório dos atendentes ---------- */
const difMin = (a,b) => Math.max(0, Math.round((new Date(b)-new Date(a))/60000));
const SAUDA = /^(ol[aá]|oi|bom dia|boa tarde|boa noite)/i, OFERECE = /cat[aá]logo|separei|sugest|oferta|promo/i;
// números de uma conversa: 1ª resposta, tempo de cada resposta e os quatro pontos do padrão
function medir(cv){
  const ini = cv.msgs.find(m=>m.de==='cli'), nos = cv.msgs.filter(m=>m.de==='nos'), r1 = ini && nos.find(m=>m.t>=ini.t);
  const aberta = cv.status!=='resolvida';
  const frt = r1 ? difMin(ini.t, r1.t) : (aberta && ini ? minutos(ini.t) : null);
  const resp = []; cv.msgs.forEach((m,i)=>{ if(m.de!=='cli') return; if(cv.msgs[i+1]?.de==='cli') return; const r=cv.msgs.slice(i+1).find(x=>x.de==='nos'); if(r) resp.push(difMin(m.t, r.t)); });
  const pedido = cv.pedido ? E.pedidos.find(p=>p.id===cv.pedido) : null;
  return { data:(ini||cv.msgs[0]).t.slice(0,10), hora:new Date((ini||cv.msgs[0]).t).getHours(), frt, semResp:!r1, resp, nos:nos.length, macros:nos.filter(m=>m.macro).length,
    saudou: !!(r1 && SAUDA.test(r1.txt.trim())), prazo: r1 ? frt<=SLA_MIN : false, ofereceu: nos.some(m=>m.oferta||OFERECE.test(m.txt)), encerrou: cv.status==='resolvida' && !cv.semFim && !cv.semResp,
    csat: cv.csat, virou: cv.tags.includes('pedido criado'), valor: cv.valorPedido || (pedido ? totalPedido(pedido) : 0) };
}
const media = L => L.length ? L.reduce((a,b)=>a+b,0)/L.length : null;
const mediana = L => { if(!L.length) return null; const s=[...L].sort((a,b)=>a-b), m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const fmtMin = m => m==null ? '—' : m<60 ? Math.round(m)+' min' : Math.floor(m/60)+'h'+String(Math.round(m%60)).padStart(2,'0');
const pctN = (a,b) => b ? Math.round(a/b*100)+'%' : '—';
function convsPeriodo(){ const de = perAt===1 ? hoje : addDias(hoje, -perAt+1); return E.conversas.map(cv=>({cv, m:medir(cv)})).filter(x=>x.m.data>=de); }
function agrega(L){
  const fr = L.filter(x=>!x.m.semResp).map(x=>x.m.frt), cs = L.map(x=>x.m.csat).filter(x=>x!=null), nos = L.reduce((s,x)=>s+x.m.nos,0);
  const pad = L.map(x=>(x.m.saudou+x.m.prazo+x.m.ofereceu+x.m.encerrou)/4);
  return { n:L.length, frtMed:media(fr), frtMd:mediana(fr), respMed:media(L.flatMap(x=>x.m.resp)), prazo:L.filter(x=>x.m.prazo).length, semResp:L.filter(x=>x.m.semResp).length,
    encerrou:L.filter(x=>x.m.encerrou).length, csat:media(cs), nCsat:cs.length, virou:L.filter(x=>x.m.virou).length, valor:L.reduce((s,x)=>s+x.m.valor,0),
    macro: nos ? L.reduce((s,x)=>s+x.m.macros,0)/nos : 0, padrao:media(pad), saudou:L.filter(x=>x.m.saudou).length, ofereceu:L.filter(x=>x.m.ofereceu).length };
}
function relatorioAt(){
  const L = convsPeriodo(), T = agrega(L);
  const nomes = [...new Set(L.map(x=>x.cv.atendente||'Sem atendente'))].sort((a,b)=>a==='Sem atendente'?1:b==='Sem atendente'?-1:a.localeCompare(b));
  const linhas = nomes.map(n=>[n, agrega(L.filter(x=>(x.cv.atendente||'Sem atendente')===n))]);

function detalheAt(nome){
  const L = convsPeriodo().filter(x=>(x.cv.atendente||'Sem atendente')===nome).sort((a,b)=>b.m.data.localeCompare(a.m.data)), a = agrega(L);

  ${L.map(x=>`<tr class="clica" onclick="fecharModal();convSel=${x.cv.id};abaAt='conversas';filtroConv='todas';ir('atendimento')"><td>${dataBR(x.m.data)} ${String(x.m.hora).padStart(2,'0')}h</td><td>${esc(x.cv.nome)}</td><td class="num ${x.m.frt>SLA_MIN?'verm':''}">${x.m.semResp?'sem resposta':fmtMin(x.m.frt)}</td><td>${ck(x.m.saudou)}</td><td>${ck(x.m.prazo)}</td><td>${ck(x.m.ofereceu)}</td><td>${ck(x.m.encerrou)}</td><td class="num">${x.m.csat??'—'}</td><td class="num">${x.m.virou?brl(x.m.valor):'—'}</td></tr>`).join('')}</table></div>

function exportarAt(){
  const L = convsPeriodo(), q = x => '"'+String(x??'').replace(/"/g,'""')+'"';
  const txt = '﻿' + ['data;hora;atendente;cliente;primeira_resposta_min;no_prazo;cumprimentou;ofereceu;encerrou;nota;virou_pedido;valor_pedido'].concat(L.map(x=>[x.m.data,x.m.hora,x.cv.atendente||'sem atendente',x.cv.nome,x.m.semResp?'':x.m.frt,x.m.prazo?'sim':'não',x.m.saudou?'sim':'não',x.m.ofereceu?'sim':'não',x.m.encerrou?'sim':'não',x.m.csat??'',x.m.virou?'sim':'não',n0(x.m.valor)].map(q).join(';'))).join('\n');

};
function botaoPasso(p){
  if (p.status==='aguardando') return aprova() ? `<button class="btn peq verde" onclick="liberar(${p.id},true)">Liberar</button> <button class="btn peq" onclick="liberar(${p.id},false)">Recusar</button>` : '<small class="pend">esperando o Márcio</small>';
  if (p.status==='novo' && !p.ml) return `<button class="btn peq" onclick="avancar(${p.id},'separando')">Separar</button>`;
  if (p.status==='novo' || p.status==='separando') return `<button class="btn peq prim" onclick="faturar(${p.id})">Emitir NF-e</button>`;
  if (p.status==='faturado' && p.ml) return `<button class="btn peq prim" onclick="etiquetaML(${p.id})">${p.ml.etiqueta?'Reimprimir etiqueta':'Imprimir etiqueta'}</button>${p.ml.etiqueta?` <button class="btn peq" onclick="avancar(${p.id},'rota')">Enviado</button>`:''}`;
  if (p.status==='faturado' && p.origem==='Loja') return `<button class="btn peq" onclick="avancar(${p.id},'entregue')">Retirado no balcão</button>`;
  if (p.status==='faturado') return `<button class="btn peq" onclick="ir('entregas')">Pôr na carga</button>`;
  if (p.status==='rota' && p.ml) return `<button class="btn peq" onclick="avancar(${p.id},'entregue')">Entregue</button>`;
  if (p.status==='rota') return '<small class="suave">na carga</small>';
  return '';
}

// o que impede o pedido de sair direto: desconto acima do máximo, verba flex estourada ou crédito (vencido ou limite)
function travaDesconto(L, flex){

  const cond = E.condicoes.find(x=>x.id===R.cond) || E.condicoes[0];

function fecharPedido(){
  const L = linhasR(), cond = E.condicoes.find(x=>x.id===R.cond);

  const p = {id, data:hoje, cli:R.cli, vend:R.vend, origem:R.origem, status:espera?'aguardando':'novo', pag:R.pag, cond:R.cond, acresc:cond.acresc, itens:L.map(l=>({c:l.c,q:l.q,p:l.p,tab:l.tab}))};
  if (trava) p.aprov = espera ? {motivo:trava} : {motivo:trava, por:perfil().nome, em:hoje};
  L.filter(l=>estD(l.prod)!=null && l.q>estD(l.prod)).forEach(l=>E.faltas.push({data:hoje, c:l.c, q:l.q, est:estD(l.prod), cli:R.cli, ped:id}));
  E.pedidos.push(p); if(!espera) gerarTitulos(p, E);
  const cv = R.conv && E.conversas.find(x=>x.id===R.conv);
  if (cv){ cv.pedido = id; cv.msgs.push({de:'sis', t:new Date().toISOString(), txt:`Pedido #${id} criado · ${brl(totalPedido(p))}`}); if(!cv.tags.includes('pedido criado')) cv.tags.push('pedido criado'); }
  const c=cliente(p.cli); if(c && c.etapa!=='ativo'){ reg(`${c.nome}: ${ETAPAS[c.etapa]} → Cliente ativo (primeiro pedido)`, {cli:c.id}); c.etapa='ativo'; c.ganho=hoje; }
  reg(`Criou o pedido #${id} (${brl(totalPedido(p))})${espera?', esperando liberação':''}`, {ped:id, cli:p.cli});
  salvar(); R=null; ir('pedidos'); verPedido(id); toast(espera?'Pedido #'+id+' enviado para o Márcio liberar':'Pedido #'+id+' criado');
}

// conciliação: cada linha do extrato ligada ao que explica ela
function sugestoes(x){

    .concat(E.pedidos.filter(p=>p.ml && p.ml.recebe!=null && ig(p.ml.recebe) && !E.extrato.some(e=>e.conc?.tipo==='ml'&&e.conc.id===p.id)).map(p=>({tipo:'ml', id:p.id, txt:`Repasse do ML do pedido #${p.id} (${dataBR(p.data)})`})));
  return E.pagar.filter(t=>!t.pago && ig(t.valor)).map(t=>({tipo:'pagar', id:t.id, txt:`${t.forn} · venc. ${dataBR(t.venc)}`}));
}
FIN.conciliacao = () => {
  const L = E.extrato.slice().sort((a,b)=>b.data.localeCompare(a.data)), falta = L.filter(x=>!x.conc);

function conciliar(id, tipo, ref){
  const x=E.extrato.find(e=>e.id===id); x.conc={tipo, id:ref};
  if (tipo==='titulo') E.titulos.find(t=>t.id===ref).pago = x.data;

  reg(`Conferiu no extrato: ${x.desc} (${brl(x.valor)}) → ${textoConc(x.conc)}`); salvar(); ir('financeiro'); toast('Conferido');
}
FIN.dre = () => {
  const ps = E.pedidos.filter(doMes), ml = ps.filter(p=>p.ml);
  const receita = ps.reduce((s,p)=>s+totalPedido(p),0);
  const imp = receita*E.regras.imposto/100;
  const tarML = ml.reduce((s,p)=>s+(p.ml.recebe!=null?totalPedido(p)-p.ml.recebe:0),0);
  const cmv = ps.reduce((s,p)=>s+custoPedido(p),0);
  const emb = ml.length*E.regras.embalagem;
  const fixas = E.pagar.filter(t=>t.tipo==='fixa' && t.venc.slice(0,7)===mesAtual).reduce((s,t)=>s+t.valor,0);
  const comis = VEND().reduce((s,v)=>s+comissaoDe(vendidoVend(v.id)).valor,0);
  const liq = receita-imp-tarML, bruto = liq-cmv, res = bruto-emb-fixas-comis;
  const L = [['Vendas do mês (todos os canais)', receita, 1],['(−) Imposto Simples '+E.regras.imposto+'%', -imp],['(−) Tarifas e frete do Mercado Livre', -tarML],['= Receita líquida', liq, 1],['(−) Custo das mercadorias (Pedidook)', -cmv],['= Lucro bruto', bruto, 1],['(−) Embalagem das vendas do ML', -emb],['(−) Comissão dos vendedores', -comis],['(−) Despesas fixas do mês', -fixas],['= Resultado do mês', res, 2]];
  return `<div class="aviso">Despesas fixas e comissão são de exemplo. O imposto usa o Simples de 6% informado pelo Márcio em 28/08.</div>
  <div class="grade g32" style="align-items:start"><div class="cartao tabela"><table>${L.map(([n,v,b])=>`<tr><td>${b?`<b>${n}</b>`:n}</td><td class="num">${b?`<b class="${v<0?'verm':''}" style="${b===2?'font-size:20px':''}">${brl(v)}</b>`:brl(v)}</td><td class="num suave">${receita?pct(v/receita):''}</td></tr>`).join('')}</table></div>
  <div class="cartao"><h2>Por canal</h2>${[...new Set(ps.map(p=>p.origem))].map(o=>{const q=ps.filter(p=>p.origem===o), v=q.reduce((s,p)=>s+totalPedido(p),0), c=q.reduce((s,p)=>s+custoPedido(p),0), t=q.filter(p=>p.ml).reduce((s,p)=>s+(p.ml.recebe!=null?totalPedido(p)-p.ml.recebe:0),0); const sob=v-c-t-v*E.regras.imposto/100; return `<div class="forma"><span><b>${esc(o)}</b><br><small class="suave">${q.length} pedido(s) · vendeu ${brl(v)}</small></span><span style="text-align:right"><b class="${sob<0?'verm':'pos'}">${brl(sob)}</b><br><small class="suave">${pct(sob/v)} depois de custo, imposto e tarifa</small></span></div>`;}).join('')}</div></div>`;
};

  let linhas;

  <tr><td><b>Total</b></td><td></td><td class="num"><b>${brl(T.v)}</b></td><td class="num"><b>${brl(T.c)}</b></td><td class="num"><b>${brl(T.v-T.c)}</b></td><td class="num"><b>${pct((T.v-T.c)/T.v)}</b></td><td class="num"><b>${T.c?pct(T.v/T.c-1):'—'}</b></td></tr>

      ${regra('imposto','Imposto','Simples, sobre a venda','','%')}
      ${regra('embalagem','Embalagem por envio do ML','caixa e fita','R$')}
      <div class="forma"><span><b>Comissão do ML</b><br><small class="suave">média do plano; muda por categoria</small></span><span style="display:flex;gap:6px;align-items:center;font-size:13px">Clássico <input class="campo mini" style="width:60px" value="${n0(R.mlComissao['Clássico'])}" onchange="E.regras.mlComissao['Clássico']=num(this.value);reg('Comissão Clássico: '+this.value+'%');salvar()">% Premium <input class="campo mini" style="width:60px" value="${n0(R.mlComissao.Premium)}" onchange="E.regras.mlComissao.Premium=num(this.value);reg('Comissão Premium: '+this.value+'%');salvar()">%</span></div>
      ${regra('mlFixo','Custo fixo do ML abaixo de R$ 79','acima disso entra o frete grátis','R$')}
      ${regra('margemAlvo','Margem mínima','para o preço mínimo de cada canal','','%')}
      ${regra('mlSeg','Estoque de segurança no ML','o anúncio mostra o disponível menos isso','','un')}
    </div>
    <div class="cartao"><h2>Condições de pagamento</h2>
      ${E.condicoes.map((c,i)=>`<div class="forma"><span><b>${c.nome}</b><br><small class="suave">${c.parc.map(d=>d?d+' dias':'na hora').join(' / ')}</small></span><span>acréscimo <input class="campo mini" style="width:70px" type="number" value="${c.acresc}" onchange="E.condicoes[${i}].acresc=+this.value;reg('Acréscimo ${c.nome}: '+this.value+'%');salvar()"> %</span></div>`).join('')}
      <p class="suave" style="font-size:12px;margin-top:8px">Cada cliente tem as condições liberadas na ficha dele.</p>
    </div>
    <div class="cartao"><h2>Preço por quantidade</h2>
      ${E.faixas.map((f,i)=>`<div class="forma"><span>${f.cat?esc(f.cat):'Todos os produtos'}: a partir de <b>${f.min}</b> un</span><span><b>−${f.desc}%</b> <button class="x" onclick="E.faixas.splice(${i},1);reg('Tirou uma faixa de preço por quantidade');salvar();ir('ajustes')">×</button></span></div>`).join('')}
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><select class="campo" id="fx-cat" style="flex:1;min-width:150px"><option value="">Todos os produtos</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input class="campo mini" id="fx-min" placeholder="a partir de"><input class="campo mini" id="fx-desc" placeholder="% desc"><button class="btn" onclick="addFaixa()">Adicionar</button></div>
    </div>
    <div class="cartao"><h2>Comissão escalonada</h2>
      ${E.comissao.map((f,i)=>`<div class="forma"><span>${i===0?'Até':'De '+brl(E.comissao[i-1].ate)+' até'} ${f.ate==null?'acima':brl(f.ate)}</span><span><input class="campo mini" style="width:70px" type="number" value="${f.pct}" onchange="E.comissao[${i}].pct=+this.value;reg('Comissão faixa ${i+1}: '+this.value+'%');salvar()"> %</span></div>`).join('')}
      <div class="forma"><span><b>Comissão calculada sobre</b><br><small class="suave">faturado: o que saiu com nota · recebido: o que o cliente já pagou</small></span><select class="campo" style="width:auto" onchange="E.regras.comBase=this.value;reg('Comissão passa a ser '+(this.value==='recebido'?'sobre o recebido':'sobre o faturado'));salvar();ir('ajustes')"><option value="faturado" ${E.regras.comBase!=='recebido'?'selected':''}>Faturado</option><option value="recebido" ${E.regras.comBase==='recebido'?'selected':''}>Recebido</option></select></div>
      <p class="suave" style="font-size:12px;margin-top:8px">A faixa atingida no mês vale para o total. <span class="pend">Regra a definir pelo Márcio antes de janeiro.</span></p>
    </div>
    <div class="cartao"><h2>Automações</h2>
      ${(E.automacoes||[]).map(a=>`<div class="forma"><span><b>${esc(a.nome)}</b><br><small class="suave">${esc(a.acao)} · ${E.tarefas.filter(t=>t.auto===a.id && !t.feita).length} tarefa(s) aberta(s) agora</small></span><label class="chk"><input type="checkbox" ${a.on?'checked':''} onchange="togAuto('${a.id}',this.checked)"> ${a.on?'ligada':'desligada'}</label></div>`).join('')}
      <p class="suave" style="font-size:12px;margin-top:8px">Roda quando alguém abre o sistema. Não abre tarefa repetida para o mesmo cliente.</p>
    </div>
    <div class="cartao"><h2>Compras e estoque</h2>
      ${regra('segDias','Dias de segurança','somados ao prazo do fornecedor no ponto de pedido','','dias')}
      ${regra('cobertura','Comprar para quantos dias','a sugestão cobre o prazo mais estes dias de venda','','dias')}
      ${regra('leadPadrao','Prazo de entrega padrão','quando o fornecedor não tem prazo próprio','','dias')}
      <p class="suave" style="font-size:12px;margin-top:8px">O prazo de cada fornecedor muda em Compras.</p>
    </div>
    <div class="cartao"><h2>Nota fiscal</h2>
      <div class="forma"><span><b>Emissor</b><br><small class="suave">quem fala com a SEFAZ, assina o XML e gera o DANFE</small></span><span style="text-align:right;font-size:13px">${esc(E.fiscal?.emissor)}</span></div>
      <div class="forma"><span><b>Ambiente</b><br><small class="suave">só vai para produção depois que o contador conferir algumas notas</small></span><span class="tag esp">${esc(E.fiscal?.ambiente)}</span></div>
      <div class="forma"><span><b>Regime</b></span><span>Simples Nacional · CSOSN 102</span></div>
      <div class="forma"><span><b>Certificado digital A1 da M7</b></span><span class="tag esp">pendente</span></div>
      <div class="forma"><span><b>Credenciamento de NFC-e (CSC) na SEFAZ-MG</b></span><span class="tag esp">pendente</span></div>
      <div class="forma"><span><b>Tabela fiscal validada pelo contador</b><br><small class="suave">NCM, CFOP, CSOSN, CEST e origem de cada produto</small></span><span class="tag esp">pendente</span></div>
      <div class="forma"><span><b>Campos de IBS e CBS</b><br><small class="suave">obrigatórios para o Simples em 2027 (data a confirmar na NT 2025.002)</small></span><span class="tag">preparado</span></div>
      <div class="forma"><span><b>Notas de compra (manifestação)</b><br><small class="suave">a API baixa o XML de toda nota emitida contra o CNPJ da M7</small></span><span class="tag ok">ligado no protótipo</span></div>
    </div>
    <div class="cartao"><h2>Metas, verba flex e desconto máximo</h2>
      ${VEND().map(v=>{const i=E.vendedores.indexOf(v);return `<div class="forma"><span><b>${esc(v.nome)}</b></span><span style="display:flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap;justify-content:flex-end">meta <input class="campo mini" value="${v.meta}" onchange="E.vendedores[${i}].meta=num(this.value);reg('Meta de ${v.nome}: '+this.value);salvar()"> flex <input class="campo mini" style="width:70px" value="${v.verba}" onchange="E.vendedores[${i}].verba=num(this.value);reg('Verba flex de ${v.nome}: '+this.value);salvar()"> desc. máx. <input class="campo mini" style="width:50px" value="${v.descMax}" onchange="E.vendedores[${i}].descMax=num(this.value);reg('Desconto máximo de ${v.nome}: '+this.value+'%');salvar()">%</span></div>`;}).join('')}
      <p class="suave" style="font-size:12px;margin-top:8px">Acima do desconto máximo, o pedido espera alguém com o acesso "libera desconto".</p>
    </div>
    <div class="cartao" style="grid-column:1/-1"><h2>Quem vê o quê</h2>
      <div class="tabela"><table><tr><th>Perfil</th>${TELAS.map(t=>`<th style="font-size:10px;writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 4px">${t[1]}</th>`).join('')}<th style="font-size:10px;writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 4px">Custo e lucro</th><th style="font-size:10px;writing-mode:vertical-rl;transform:rotate(180deg);padding:6px 4px">Libera desconto</th></tr>
      ${E.perfis.map((p,i)=>`<tr><td style="white-space:nowrap">${esc(p.nome)}</td>${TELAS.map(([t])=>`<td style="text-align:center;padding:6px 4px"><input type="checkbox" ${p.telas.includes(t)?'checked':''} ${p.id==='dono'?'disabled':''} onchange="togTela(${i},'${t}',this.checked)"></td>`).join('')}<td style="text-align:center"><input type="checkbox" ${p.custo?'checked':''} ${p.id==='dono'?'disabled':''} onchange="E.perfis[${i}].custo=this.checked;reg('${p.nome}: '+(this.checked?'passa a ver':'deixa de ver')+' custo');salvar()"></td><td style="text-align:center"><input type="checkbox" ${p.aprova?'checked':''} ${p.id==='dono'?'disabled':''} onchange="E.perfis[${i}].aprova=this.checked;reg('${p.nome}: '+(this.checked?'pode':'não pode')+' liberar desconto');salvar()"></td></tr>`).join('')}</table></div>
      <p class="suave" style="font-size:12px;margin-top:8px">Troque o perfil no rodapé do menu para ver como cada um enxerga o sistema.</p>
    </div>
    <div class="cartao" style="grid-column:1/-1"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h2 style="margin:0">Histórico de alterações</h2><input class="campo" style="max-width:280px" placeholder="Filtrar..." value="${esc(filtroLog)}" onchange="filtroLog=this.value;ir('ajustes')"></div>
      <div class="tabela" style="max-height:340px;overflow:auto"><table><tr><th>Quando</th><th>Quem</th><th>O quê</th></tr>${logs.map(l=>`<tr><td class="suave" style="white-space:nowrap">${new Date(l.t).toLocaleString('pt-BR').slice(0,17)}</td><td style="white-space:nowrap">${esc(l.quem)}</td><td>${esc(l.acao)}${l.ped?` · <a href="#" onclick="verPedido(${l.ped});return false">#${l.ped}</a>`:''}</td></tr>`).join('')}</table></div>
      <p class="suave" style="font-size:12px;margin-top:8px">Toda mudança de preço, desconto, status, nota, estoque, cadastro e acesso fica aqui com o nome de quem fez. Ninguém apaga.</p>
    </div>
    <div class="cartao"><h2>Seus dados são seus</h2>
      <p style="font-size:14px;margin-bottom:12px">Exportar tudo a qualquer hora, sem pedir para ninguém.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportar('pedidos')">Pedidos (CSV)</button><button class="btn" onclick="exportar('clientes')">Clientes (CSV)</button><button class="btn" onclick="exportar('produtos')">Produtos e estoque (CSV)</button><button class="btn prim" onclick="exportar('tudo')">Tudo (JSON)</button></div>
    </div>
    <div class="cartao"><h2>A definir com o Márcio</h2>
      <div class="forma"><span>Ajuste da tabela de atacado</span><span class="tag esp">pendente</span></div>
      <div class="forma"><span>Regra de comissão dos vendedores</span><span class="tag esp">antes de jan/2027</span></div>
      <div class="forma"><span>Verba flex e desconto máximo por vendedor</span><span class="tag esp">pendente</span></div>
      <div class="forma"><span>Acréscimo das condições a prazo</span><span class="tag esp">pendente</span></div>
      <div class="forma"><span>No site, o cliente paga ou o pedido vai para aprovação?</span><span class="tag esp">pendente</span></div>
      <div class="forma"><span>Nota fiscal por API: qual emissor (Focus NFe, Brasil NFe ou outro)</span><span class="tag esp">pendente</span></div>
      <div class="forma"><span>Quem é o contador da M7 e se valida a tabela fiscal</span><span class="tag esp">pendente</span></div>
      <div class="forma"><span>A M7 vende a prazo? Limite de crédito de cada cliente</span><span class="tag esp">pendente</span></div>
      <div class="forma"><span>Prazo de entrega de cada fornecedor</span><span class="tag esp">pendente</span></div>
      <div class="forma"><span>Onde os vendedores vão rodar (sinal de internet)</span><span class="tag esp">pendente</span></div>
      <div class="forma"><span>Peso e medida dos produtos no cadastro</span><span class="tag esp">${P.filter(p=>p.kg).length} de ${P.length} têm peso</span></div>
      <div class="forma"><span>Estoque mínimo por produto</span><span class="tag esp">${P.filter(p=>p.min).length} têm mínimo</span></div>
      <div class="forma"><span>EAN dos produtos (o ML exige em algumas categorias)</span><span class="tag esp">${P.filter(p=>!p.ean).length} sem EAN</span></div>
    </div>
  </div>`;
};
function mudaRegra(k,v,l){ E.regras[k]=num(v); reg(`${l}: ${v}`); salvar(); }
function addFaixa(){ const min=parseInt(document.getElementById('fx-min').value), d=num(document.getElementById('fx-desc').value); if(!min||!d) return toast('Preencha a quantidade e o desconto'); E.faixas.push({cat:document.getElementById('fx-cat').value, min, desc:d}); reg(`Faixa nova: a partir de ${min} un, −${d}%`); salvar(); ir('ajustes'); }
function togTela(i,t,on){ const p=E.perfis[i]; p.telas = on ? [...new Set([...p.telas,t])] : p.telas.filter(x=>x!==t); if(!p.telas.length) p.telas=['pedidos']; reg(`${p.nome}: ${on?'passa a ver':'deixa de ver'} ${TELAS.find(x=>x[0]===t)[1]}`); salvar(); }
function exportar(o){
  const csv = (cab, L) => '﻿' + [cab.join(';'), ...L.map(l=>l.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';'))].join('\n');
  let nome, txt, tipo='text/csv';
  if (o==='pedidos'){ nome='pedidos.csv'; txt=csv(['numero','data','cliente','canal','vendedor','status','nf','condicao','pagamento','total'], E.pedidos.map(p=>[p.id,p.data,cliente(p.cli)?.nome,p.origem,vendedor(p.vend)?.nome,STATUS[p.status][0],p.nf?.n,condNome(p.cond),p.pag,n0(totalPedido(p))])); }
  else if (o==='clientes'){ nome='clientes.csv'; txt=csv(['id','nome','tipo','cidade','whatsapp','origem','etapa','vendedor','tabela','desconto','limite'], E.clientes.map(c=>[c.id,c.nome,c.tipo,c.cidade,c.fone,c.origem,ETAPAS[c.etapa],vendedor(c.vend)?.nome,c.tabela,c.desc,c.limite])); }
  else if (o==='produtos'){ nome='produtos.csv'; txt=csv(['codigo','nome','categoria','fisico','reservado','disponivel','preco','custo','ncm','ean'], P.map(p=>[p.c,p.n,p.cat,n0(estF(p)),n0(estR(p)),n0(estD(p)),n0(p.p),n0(p.custo),p.ncm,p.ean])); }
  else { nome='sistema-m7-'+hoje+'.json'; txt=JSON.stringify(E,null,1); tipo='application/json'; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:tipo})); a.download=nome; a.click(); reg('Exportou '+nome); salvar(); toast('Baixando '+nome);
}

ir(TELAS_DE()[0]);
</script>
</body>
</html>
