<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Sistema M7</title>
<link rel="icon" href="assets/m7.ico">
<link rel="stylesheet" href="../identidade-visual/tokens.css">
<style>
/* tela de login (16/10/2026): entra com Márcio / admin e cai no sistema claro; a lua/sol fica lá dentro */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100vh;background:var(--preto);color:var(--on-dark-2);font-family:var(--font-body);display:grid;grid-template-columns:1.1fr 1fr}
button,input{font:inherit;color:inherit}

.marca{position:relative;overflow:hidden;background:var(--grad-brand);padding:48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--linha-escura)}
.marca::before{content:"";position:absolute;inset:0;background:url(assets/padrao-m7.png) center/420px repeat;opacity:.06;pointer-events:none}
.marca::after{content:"";position:absolute;width:560px;height:560px;right:-180px;bottom:-220px;border-radius:50%;background:radial-gradient(circle,rgba(142,209,77,.22),transparent 65%);pointer-events:none}
.marca>*{position:relative;z-index:1}
.marca img{width:200px}
.marca h1{font-family:var(--font-display);text-transform:uppercase;font-weight:700;font-size:clamp(40px,5vw,64px);line-height:.95;color:var(--on-dark);letter-spacing:.5px}
.marca h1 em{font-style:normal;color:var(--verde)}
.marca p{color:var(--on-dark-dim);margin-top:16px;max-width:420px;line-height:1.5;font-size:16px}
.marca .seg{font-family:var(--font-desc);color:var(--on-dark-dim);font-size:13px;letter-spacing:.4px}

.lado{display:flex;align-items:center;justify-content:center;padding:40px 24px}
form{width:100%;max-width:380px}
form .simb{display:none;width:150px;margin-bottom:28px}
form h2{font-family:var(--font-display);text-transform:uppercase;font-size:34px;color:var(--on-dark);line-height:1}
form .sub{color:var(--on-dark-dim);margin:8px 0 28px;font-size:15px}
label{display:block;font-size:13px;font-weight:600;color:var(--on-dark-2);margin:0 0 6px;letter-spacing:.3px}
.campo{position:relative;margin-bottom:18px}
.campo input{width:100%;background:var(--grafite);border:1.5px solid var(--linha-escura);border-radius:10px;padding:14px 14px;font-size:16px;color:var(--on-dark);outline:none;transition:border-color .15s,box-shadow .15s}
.campo input::placeholder{color:#5c6157}
.campo input:focus{border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-veu)}
.campo.senha input{padding-right:52px}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--on-dark-dim);padding:8px;border-radius:8px;display:flex}
.olho:hover{color:var(--verde)}
.olho .fechado{display:none}
.olho.ver .aberto{display:none}
.olho.ver .fechado{display:block}
.linha{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 22px;font-size:14px;color:var(--on-dark-dim)}
.linha label{display:flex;align-items:center;gap:8px;margin:0;font-weight:500;color:var(--on-dark-dim);cursor:pointer}
.linha input{accent-color:var(--verde);width:16px;height:16px}
.entrar{width:100%;background:var(--verde);color:#000;border:0;border-radius:10px;padding:15px;font-weight:700;font-size:17px;cursor:pointer;transition:background .15s,transform .05s}
.entrar:hover{background:var(--verde-claro)}
.entrar:active{transform:translateY(1px)}
.erro{display:none;background:rgba(239,90,80,.12);border:1px solid rgba(239,90,80,.35);color:#FF8A80;border-radius:10px;padding:11px 14px;font-size:14px;margin-bottom:18px}
.erro.on{display:block}
form.tremer{animation:tremer .35s}
@keyframes tremer{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.rod{margin-top:28px;font-size:12px;color:#5c6157;text-align:center}

@media (max-width:820px){
  body{grid-template-columns:1fr}
  .marca{display:none}
  form .simb{display:block}
  .lado{padding:32px 16px}
}
</style>
</head>
<body>

<section class="marca">
  <img src="../identidade-visual/marca/m7-horizontal-cor-escuro.svg" alt="M7 Distribuidora">
  <div>
    <h1>Tudo da M7<br>num <em>lugar só</em></h1>
    <p>Pedidos, estoque, clientes, financeiro, WhatsApp e Mercado Livre na mesma tela.</p>
  </div>
  <div class="seg">Embalagens · Descartáveis · Higiene e Limpeza · Bomboniere · Festa · Açaí · Frios</div>
</section>

<main class="lado">
  <form id="f" autocomplete="off" novalidate>
    <img class="simb" src="../identidade-visual/marca/m7-horizontal-cor-escuro.svg" alt="M7 Distribuidora">
    <h2>Entrar</h2>
    <p class="sub">Use seu usuário e senha do sistema.</p>

    <div class="erro" id="erro">Usuário ou senha incorretos.</div>

    <label for="usuario">Usuário</label>
    <div class="campo"><input id="usuario" name="usuario" placeholder="Seu usuário" autocapitalize="words" autofocus></div>

    <label for="senha">Senha</label>
    <div class="campo senha">
      <input id="senha" name="senha" type="password" placeholder="Sua senha">
      <button type="button" class="olho" id="olho" title="Mostrar senha" aria-label="Mostrar senha">
        <svg class="aberto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="fechado" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.4 0-10-7-10-7a18.4 18.4 0 0 1 5.1-5.9M9.9 5.2A9.6 9.6 0 0 1 12 5c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"/></svg>
      </button>
    </div>

    <div class="linha"><label><input type="checkbox" id="lembrar" checked> Lembrar usuário</label></div>

    <button class="entrar" type="submit">Entrar</button>
    <div class="rod">Sistema M7 · protótipo v0.8</div>
  </form>
</main>

<script>
const f = document.getElementById('f'), u = document.getElementById('usuario'), s = document.getElementById('senha'), erro = document.getElementById('erro');
const semAcento = t => t.normalize('NFD').replace(/[̀-ͯ]/g,'').trim().toLowerCase();
try{ const lembrado = localStorage.getItem('m7-login-usuario'); if(lembrado){ u.value = lembrado; s.focus(); } }catch(e){}

document.getElementById('olho').onclick = function(){
  const ver = s.type === 'password'; s.type = ver ? 'text' : 'password';
  this.classList.toggle('ver', ver); this.title = ver ? 'Esconder senha' : 'Mostrar senha'; s.focus();
};
[u, s].forEach(el => el.addEventListener('input', () => erro.classList.remove('on')));

f.onsubmit = e => {
  e.preventDefault();
  if (semAcento(u.value) === 'marcio' && s.value === 'admin') {
    try{
      sessionStorage.setItem('m7-login', 'dono');
      if (document.getElementById('lembrar').checked) localStorage.setItem('m7-login-usuario', 'Márcio'); else localStorage.removeItem('m7-login-usuario');
    }catch(x){}
    location.replace('index.html');
  } else {
    erro.classList.add('on'); s.value = ''; s.focus();
    f.classList.remove('tremer'); void f.offsetWidth; f.classList.add('tremer');
  }
};
</script>
</body>
</html>
